name: apt-realtime-orders

services:
  # ── 1. PostgreSQL Database with WAL Logical Replication Enabled ─────────
  postgres:
    image: postgres:16-alpine
    container_name: orders-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-apt_realtime_orders}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-apt_realtime_orders}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cdc-network

  # ── 2. Kafka Broker (KRaft Mode - No Zookeeper Required) ───────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: orders-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - cdc-network

  # ── 3. Debezium Kafka Connect Service ──────────────────────────────────
  debezium:
    image: debezium/connect:2.6.2.Final
    container_name: orders-debezium
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - cdc-network

  # ── 4. Debezium Connector Auto-Initialization Container ────────────────
  debezium-init:
    image: curlimages/curl:8.7.1
    container_name: orders-debezium-init
    restart: on-failure
    depends_on:
      debezium:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Checking Debezium connector status..."
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" http://debezium:8083/connectors/orders-cdc-connector)
        if [ "$$STATUS" -eq 200 ]; then
          echo "Connector orders-cdc-connector already registered."
        else
          echo "Registering Debezium PostgreSQL connector..."
          curl -i -X POST -H "Accept:application/json" -H "Content-Type:application/json" http://debezium:8083/connectors/ -d '{
            "name": "orders-cdc-connector",
            "config": {
              "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
              "tasks.max": "1",
              "plugin.name": "pgoutput",
              "database.hostname": "'"${DB_HOST:-postgres}"'",
              "database.port": "'"${DB_PORT:-5432}"'",
              "database.user": "'"${DB_USER:-postgres}"'",
              "database.password": "'"${DB_PASSWORD:-postgres}"'",
              "database.dbname": "'"${DB_NAME:-apt_realtime_orders}"'",
              "topic.prefix": "cdc",
              "schema.include.list": "public",
              "table.include.list": "public.orders",
              "slot.name": "orders_cdc_slot",
              "publication.name": "orders_cdc_publication",
              "publication.autocreate.mode": "filtered",
              "snapshot.mode": "initial",
              "tombstones.on.delete": "false",
              "slot.drop.on.stop": "false"
            }
          }'
        fi
    networks:
      - cdc-network

  # ── 5. Node.js Application Service ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-apt_realtime_orders}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-realtime-orders-app}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-order-monitoring-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-cdc.public.orders}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cdc-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local

networks:
  cdc-network:
    driver: bridge
